<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MM 3D Printing – Tech Support CRM</title>

  <!-- ===== Favicon (business logo) ===== -->
  <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/mmprinting3d/MM-3D-Printing/main/images/logo.png" />

  <!-- ===== html2pdf for PDF receipt export ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* =========================================================
       THEME TOKENS  (Light mode is the default)
       ========================================================= */
    :root {
      --bg:            #f4f6fa;
      --surface:       #ffffff;
      --surface-2:     #f8fafc;
      --border:        #e3e8ef;
      --text:          #1a2233;
      --text-muted:    #64748b;
      --primary:       #1e5eff;
      --primary-dark:  #1749c9;
      --primary-soft:  #e8f0ff;
      --success:       #16a34a;
      --success-soft:  #e6f6ec;
      --warning:       #d97706;
      --warning-soft:  #fdf1e0;
      --danger:        #dc2626;
      --danger-soft:   #fdeaea;
      --shadow:        0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
      --shadow-lg:     0 10px 30px rgba(16,24,40,.12);
      --radius:        14px;
      --radius-sm:     9px;
    }
    html[data-theme="dark"] {
      --bg:            #0e131c;
      --surface:       #161c28;
      --surface-2:     #1c2534;
      --border:        #2a3546;
      --text:          #e7edf6;
      --text-muted:    #93a1b5;
      --primary:       #4f83ff;
      --primary-dark:  #3a6ae0;
      --primary-soft:  #1b2740;
      --success:       #22c55e;
      --success-soft:  #14261a;
      --warning:       #f59e0b;
      --warning-soft:  #2a2010;
      --danger:        #f26363;
      --danger-soft:   #2c1717;
      --shadow:        0 1px 3px rgba(0,0,0,.4);
      --shadow-lg:     0 12px 34px rgba(0,0,0,.5);
    }

    /* =========================================================
       BASE
       ========================================================= */
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background .2s ease, color .2s ease;
    }
    a { color: var(--primary); text-decoration: none; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    /* =========================================================
       APP LAYOUT
       ========================================================= */
    .app { display: flex; min-height: 100vh; }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; bottom: 0; left: 0;
      z-index: 40;
      transition: transform .25s ease;
    }
    .brand {
      display: flex; align-items: center; gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .brand img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; }
    .brand .brand-txt strong { display: block; font-size: 15px; line-height: 1.2; }
    .brand .brand-txt span { font-size: 11.5px; color: var(--text-muted); }
    .nav { padding: 12px; flex: 1; overflow-y: auto; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: var(--radius-sm);
      color: var(--text-muted); cursor: pointer;
      font-weight: 500; margin-bottom: 3px;
      transition: background .15s, color .15s;
    }
    .nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--primary-soft); color: var(--primary); }
    .sidebar-foot { padding: 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); }

    /* ---- Main ---- */
    .main { flex: 1; margin-left: 250px; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 14px;
      padding: 12px 22px;
    }
    .topbar img.tb-logo { width: 30px; height: 30px; object-fit: contain; }
    .menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--text); }
    .search-wrap { position: relative; flex: 1; max-width: 460px; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted); }
    .search-wrap input {
      width: 100%; padding: 10px 14px 10px 38px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface-2); color: var(--text); font-size: 14px;
    }
    .search-wrap input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
    .search-results {
      position: absolute; top: 46px; left: 0; right: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; box-shadow: var(--shadow-lg);
      max-height: 340px; overflow-y: auto; display: none; z-index: 50;
    }
    .search-results .sr-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
    .search-results .sr-item:hover { background: var(--surface-2); }
    .search-results .sr-item small { color: var(--text-muted); }
    .topbar-spacer { flex: 1; }
    .icon-btn {
      background: var(--surface-2); border: 1px solid var(--border);
      width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center; cursor: pointer; color: var(--text);
    }
    .icon-btn:hover { background: var(--primary-soft); color: var(--primary); }

    .content { padding: 26px; }
    .page-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
    .page-head h1 { margin: 0; font-size: 23px; }
    .page-head p { margin: 4px 0 0; color: var(--text-muted); font-size: 13.5px; }

    /* =========================================================
       CARDS / GRID
       ========================================================= */
    .grid { display: grid; gap: 18px; }
    .stat-grid { grid-template-columns: repeat(4, 1fr); }
    .two-col { grid-template-columns: repeat(2, 1fr); }
    .three-col { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 1100px){ .stat-grid, .three-col { grid-template-columns: repeat(2,1fr);} }
    @media (max-width: 860px){ .two-col, .three-col { grid-template-columns: 1fr; } }
    @media (max-width: 620px){ .stat-grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
    }
    .card h3 { margin: 0 0 14px; font-size: 15px; }
    .stat-card { display: flex; align-items: flex-start; gap: 14px; }
    .stat-card .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
    .stat-card .ic svg { width: 22px; height: 22px; }
    .stat-card .lbl { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
    .stat-card .val { font-size: 25px; font-weight: 700; margin-top: 2px; }
    .ic.blue{background:var(--primary-soft);color:var(--primary);}
    .ic.green{background:var(--success-soft);color:var(--success);}
    .ic.amber{background:var(--warning-soft);color:var(--warning);}
    .ic.red{background:var(--danger-soft);color:var(--danger);}

    /* =========================================================
       BUTTONS
       ========================================================= */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px; border-radius: 10px; border: 1px solid transparent;
      font-size: 14px; font-weight: 600; cursor: pointer; user-select: none;
      transition: transform .05s, background .15s; white-space: nowrap;
    }
    .btn:active { transform: translateY(1px); }
    .btn svg { width: 18px; height: 18px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: var(--surface-2); color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { background: var(--primary-soft); color: var(--primary); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { filter: brightness(.94); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 7px 11px; font-size: 13px; border-radius: 8px; }
    .btn-block { width: 100%; }

    /* =========================================================
       TABLES
       ========================================================= */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 13px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--text-muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; }
    tbody tr:hover { background: var(--surface-2); }
    td.actions { display: flex; gap: 6px; }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty svg { width: 42px; height: 42px; opacity: .5; margin-bottom: 8px; }

    /* ---- Badges ---- */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge.new{background:var(--primary-soft);color:var(--primary);}
    .badge.scheduled{background:var(--warning-soft);color:var(--warning);}
    .badge.progress{background:#e0f2fe;color:#0369a1;}
    html[data-theme="dark"] .badge.progress{background:#0c2733;color:#38bdf8;}
    .badge.completed{background:var(--success-soft);color:var(--success);}
    .badge.cancelled{background:var(--danger-soft);color:var(--danger);}

    /* =========================================================
       FORMS
       ========================================================= */
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 9px; background: var(--surface-2); color: var(--text); font-size: 14px; font-family: inherit;
    }
    .field textarea { resize: vertical; min-height: 76px; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 560px){ .form-row { grid-template-columns: 1fr; } }

    /* =========================================================
       MODAL
       ========================================================= */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(9,14,22,.55);
      display: none; align-items: flex-start; justify-content: center;
      padding: 40px 16px; z-index: 100; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: var(--radius);
      width: 100%; max-width: 620px; box-shadow: var(--shadow-lg);
      animation: pop .18s ease;
    }
    .modal.lg { max-width: 860px; }
    @keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--border); }
    .modal-head h2 { margin: 0; font-size: 18px; }
    .modal-body { padding: 22px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); }
    .x-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; }
    .x-btn:hover { color: var(--text); }

    /* =========================================================
       TIMER / BILLING
       ========================================================= */
    .timer-display { font-size: 52px; font-weight: 800; letter-spacing: 2px; text-align: center; font-variant-numeric: tabular-nums; margin: 8px 0; }
    .billing-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; }
    .billing-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
    .billing-box .bl { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .billing-box .bv { font-size: 22px; font-weight: 700; margin-top: 3px; }
    .pulse { animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.55;} }

    /* ---- Checklist ---- */
    .checklist-section { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .cl-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: var(--surface-2); cursor: pointer; font-weight: 600; }
    .cl-head .chev { transition: transform .2s; }
    .cl-head.collapsed .chev { transform: rotate(-90deg); }
    .cl-body { padding: 6px 16px 12px; }
    .cl-body.collapsed { display: none; }
    .cl-item { display: flex; align-items: center; gap: 11px; padding: 9px 4px; cursor: pointer; }
    .cl-item input { width: 19px; height: 19px; accent-color: var(--primary); cursor: pointer; }
    .cl-item span { transition: .15s; }
    .cl-item.done span { text-decoration: line-through; color: var(--text-muted); }
    .progress-track { height: 9px; border-radius: 20px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
    .progress-fill { height: 100%; background: var(--primary); transition: width .3s; }

    /* ---- Timeline ---- */
    .timeline { position: relative; padding-left: 26px; }
    .timeline::before { content:""; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--border); }
    .tl-item { position: relative; padding: 0 0 20px; }
    .tl-item::before { content:""; position:absolute; left:-22px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--primary); border:2px solid var(--surface); }
    .tl-item .tl-date { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .tl-item .tl-title { font-weight: 600; margin: 2px 0; }
    .tl-item .tl-meta { font-size: 13px; color: var(--text-muted); }

    /* ---- Receipt ---- */
    .receipt { background: #fff; color: #1a2233; border-radius: 10px; padding: 30px; max-width: 480px; margin: 0 auto; font-size: 14px; }
    .receipt .rc-head { text-align: center; border-bottom: 2px dashed #cbd5e1; padding-bottom: 16px; margin-bottom: 16px; }
    .receipt .rc-head img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 6px; }
    .receipt .rc-head h2 { margin: 4px 0 2px; font-size: 18px; }
    .receipt .rc-head small { color: #64748b; }
    .receipt .rc-row { display: flex; justify-content: space-between; padding: 5px 0; }
    .receipt .rc-row .k { color: #64748b; }
    .receipt .rc-total { border-top: 2px dashed #cbd5e1; margin-top: 14px; padding-top: 14px; display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; }
    .receipt .rc-foot { text-align: center; margin-top: 18px; color: #64748b; font-size: 12.5px; }

    /* ---- Toast ---- */
    .toast-wrap { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
    .toast {
      background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--primary);
      border-radius: 10px; box-shadow: var(--shadow-lg); padding: 13px 16px; min-width: 240px; max-width: 340px;
      display: flex; align-items: center; gap: 10px; animation: slidein .25s ease;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warn { border-left-color: var(--warning); }
    @keyframes slidein { from { transform: translateX(120%); } to { transform: none; } }

    .hidden { display: none !important; }
    .flex { display: flex; } .items-center { align-items: center; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; }
    .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 14px; } .mb-2 { margin-bottom: 10px; }
    .muted { color: var(--text-muted); } .center { text-align: center; }
    .config-banner { background: var(--warning-soft); color: var(--warning); padding: 10px 26px; font-size: 13px; font-weight: 600; text-align: center; }

    /* ---- Mobile ---- */
    .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 39; }
    @media (max-width: 900px){
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: none; }
      .main { margin-left: 0; }
      .menu-btn { display: grid; place-items: center; }
      .backdrop.show { display: block; }
    }

    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">

<div id="loginScreen" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 9999;">
  <div class="modal" style="background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 400px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
    <h2 style="margin-bottom: 8px; color: var(--text);">CRM Login</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Sign in with your Firebase account to access the CRM.</p>
    
    <div class="field" style="margin-bottom: 15px;">
      <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text);">Email</label>
      <input type="email" id="loginEmail" placeholder="admin@mmprinting.com" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);" />
    </div>
    
    <div class="field" style="margin-bottom: 20px;">
      <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text);">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);" />
    </div>
    
    <button id="loginBtn" style="width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Sign In</button>
  </div>
</div>
    
    <!-- =========================== SIDEBAR =========================== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand" onclick="navigate('dashboard')">
        <img src="https://raw.githubusercontent.com/mmprinting3d/MM-3D-Printing/main/images/logo.png" alt="MM 3D Printing logo" />
        <div class="brand-txt">
          <strong>MM 3D Printing</strong>
          <span>Tech Support Services</span>
        </div>
      </div>
      <nav class="nav" id="nav"><!-- nav items injected --></nav>
      <div class="sidebar-foot">Internal CRM • v1.0</div>
    </aside>
    <div class="backdrop" id="backdrop" onclick="toggleSidebar(false)"></div>

    <!-- =========================== MAIN =========================== -->
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <img class="tb-logo" src="https://raw.githubusercontent.com/mmprinting3d/MM-3D-Printing/main/images/logo.png" alt="logo" />
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearch" placeholder="Search customers, phone, email, receipts…"
                 autocomplete="off" oninput="doGlobalSearch(this.value)" onfocus="doGlobalSearch(this.value)" />
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="topbar-spacer"></div>
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
        </button>
      </header>

      <div class="config-banner hidden" id="configBanner">
        Demo mode: Firebase is not configured, data is saved locally in this browser. Add your Firebase config in Settings → Firebase to sync to Firestore.
      </div>

      <main class="content" id="view"><!-- views injected --></main>
    </div>
  </div>

  <!-- =========================== MODAL HOST =========================== -->
  <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>

  <!-- =========================== TOASTS =========================== -->
  <div class="toast-wrap" id="toastWrap"></div>

  <!-- Hidden print host for receipts -->
  <div id="printArea" class="hidden"></div>

  <!-- =========================================================
       APPLICATION LOGIC  (Vanilla JS + Firebase Modular SDK)
       ========================================================= -->
  <script type="module">
    /* ---------------------------------------------------------
       FIREBASE MODULAR SDK IMPORTS
       --------------------------------------------------------- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, doc, onSnapshot,
      addDoc, updateDoc, deleteDoc, setDoc, getDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    /* =========================================================
       DATA LAYER
       A thin abstraction that talks to Firestore when configured,
       and otherwise mirrors the same API against localStorage so
       the CRM is fully functional in demo mode.
       Collections: customers, appointments, services, receipts, settings
       ========================================================= */
    const COLLECTIONS = ["customers", "appointments", "services", "receipts"];
    const listeners = {}; // collectionName -> [callbacks]
    const cache = {};      // collectionName -> array of docs

    function notify(name){ (listeners[name]||[]).forEach(cb => cb(cache[name])); }
    function subscribe(name, cb){ (listeners[name] = listeners[name] || []).push(cb); if (cache[name]) cb(cache[name]); }

    // ---- Local (demo) storage helpers ----
    const LS_KEY = n => "mmcrm_" + n;
    function localLoad(name){ try { return JSON.parse(localStorage.getItem(LS_KEY(name))) || []; } catch { return []; } }
    function localSave(name){ localStorage.setItem(LS_KEY(name), JSON.stringify(cache[name])); }
    function uid(){ return "id_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

    // ---- Public data API ----
    async function dbAdd(name, data){
      data = { ...data, dateAdded: data.dateAdded || new Date().toISOString() };
      if (fdb){ const ref = await addDoc(collection(fdb, name), data); return ref.id; }
      const id = uid(); cache[name].push({ id, ...data }); localSave(name); notify(name); return id;
    }
    async function dbUpdate(name, id, data){
      if (fdb){ await updateDoc(doc(fdb, name, id), data); return; }
      const i = cache[name].findIndex(x => x.id === id);
      if (i > -1){ cache[name][i] = { ...cache[name][i], ...data }; localSave(name); notify(name); }
    }
    async function dbDelete(name, id){
      if (fdb){ await deleteDoc(doc(fdb, name, id)); return; }
      cache[name] = cache[name].filter(x => x.id !== id); localSave(name); notify(name);
    }
    function getAll(name){ return cache[name] || []; }
    function getOne(name, id){ return (cache[name]||[]).find(x => x.id === id); }

    /* =========================================================
       BILLING ENGINE
       Rate: ₪50 / 30 min  →  15-minute blocks @ ₪25 each.
       billableBlocks = ceil(workedMinutes / blockLength)
       totalCharge   = billableBlocks × pricePerBlock
       ========================================================= */
    function billing(workedMs){
      const workedMinutes = workedMs / 60000;
      const blockLen = settings.blockLength || 3;
      const perBlock = settings.pricePerBlock || 5;
      const blocks = Math.max(1, Math.ceil(workedMinutes / blockLen));
      return {
        workedMinutes,
        workedMs,
        blocks,
        perBlock,
        blockLen,
        roundedMinutes: blocks * blockLen,
        total: blocks * perBlock
      };
    }
    function money(n){ return settings.currency + Number(n || 0).toLocaleString(); }
    function fmtDuration(ms){
      const s = Math.floor(ms/1000);
      const h = String(Math.floor(s/3600)).padStart(2,"0");
      const m = String(Math.floor((s%3600)/60)).padStart(2,"0");
      const ss = String(s%60).padStart(2,"0");
      return `${h}:${m}:${ss}`;
    }
    function fmtDate(iso){ if(!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleDateString(); }
    function fmtDateTime(iso){ if(!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleString(); }
    function fmtTime(iso){ if(!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }

    function startOfToday(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }

    function startOfMonth(){ const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.getTime(); }

    function incomeSince(ts){
      return getAll("services")
        .filter(s => s.dateISO && new Date(s.dateISO).getTime() >= ts)
        .reduce((sum, s) => sum + Number(s.amount || 0), 0);
    }
    function totalIncome(){ return getAll("services").reduce((s,x)=>s+Number(x.amount||0),0); }

    /* ---------- APPOINTMENT DETAIL (checklist + timer + billing) ---------- */
    let timerInterval = null;

    function openAppointmentDetail(id){

    function renderAppointmentDetail(id){
      const a = getOne("appointments", id); if (!a) return;
      const checklist = a.checklist || {};
      let totalItems = 0, doneItems = 0;
      Object.values(CHECKLIST_TEMPLATE).forEach(items => items.forEach(it => { totalItems++; if (checklist[it]) doneItems++; }));
      const pct = totalItems ? Math.round(doneItems/totalItems*100) : 0;

      const running = !!a.timerStart && !a.timerEnd;

      openModal(`
        <div class="modal-head"><h2>${esc(a.customerName)} — Appointment</h2><button class="x-btn" onclick="stopTimerTick();closeModal()">${xIcon()}</button></div>
        <div class="modal-body">
          <div class="flex items-center gap-2 mb-2" style="flex-wrap:wrap;justify-content:space-between">

          ${a.notes ? `<div class="card" style="background:var(--surface-2);margin-bottom:14px">${esc(a.notes)}</div>`:""}

                <div class="billing-box"><div class="bl">Next Increase In</div><div class="bv" id="nextIn">—</div></div>
              </div>

                <div class="billing-box"><div class="bl">Billing Blocks</div><div class="bv" id="curBlocks">—</div></div>
                <div class="billing-box"><div class="bl">Next Charge</div><div class="bv" id="nextCharge">—</div></div>
              </div>
              <button class="btn btn-danger btn-block" onclick="endVisit('${id}')">🔴 END VISIT</button>
            ` : (a.timerEnd ? `
              <div class="muted" style="margin:8px 0">Visit completed — Base charge ${money(a.total||0)}</div>
              <button class="btn btn-ghost btn-block" onclick="startVisit('${id}', true)">Start a new visit</button>
            ` : `
              <button class="btn btn-success btn-block" onclick="startVisit('${id}')">🟢 START VISIT</button>
            `)}

          <!-- ===== JOB CHECKLIST ===== -->
          <div class="flex items-center" style="justify-content:space-between;margin-bottom:8px">
            <h3 style="margin:0">Job Checklist</h3><span class="muted" id="clPct">${pct}% complete</span>
          </div>
          <div class="progress-track mb-2"><div class="progress-fill" id="clBar" style="width:${pct}%"></div></div>
          ${Object.entries(CHECKLIST_TEMPLATE).map(([section, items], si) => `
            <div class="checklist-section">

      if (running) startTimerTick(id);

    function chevIcon(){ return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>'; }

    window.toggleClSection = function(si){
      const body = document.querySelector(`[data-cl="${si}"]`);
      const head = body.previousElementSibling;
      body.classList.toggle("collapsed"); head.classList.toggle("collapsed");
    };

    window.toggleChecklist = async function(id, item, checked){
      const a = getOne("appointments", id); if (!a) return;
      const checklist = { ...(a.checklist||{}) };
      checklist[item] = checked;
      await dbUpdate("appointments", id, { checklist }); // saved immediately to Firestore/local
      // update progress UI without full re-render
      let total=0, done=0;
      Object.values(CHECKLIST_TEMPLATE).forEach(items => items.forEach(it => { total++; if (checklist[it]) done++; }));
      const pct = total ? Math.round(done/total*100) : 0;
      const bar = document.getElementById("clBar"), lbl = document.getElementById("clPct");
      if (bar) bar.style.width = pct + "%";
      if (lbl) lbl.textContent = pct + "% complete";
      // visual done state
      const cb = event.target; cb.closest(".cl-item").classList.toggle("done", checked);
    };

    window.quickStatus = async function(id, status){
      await dbUpdate("appointments", id, { status }); toast("Status: " + status);
    };

    /* ---- VISIT TIMER ---- */
    window.startVisit = async function(id, restart){
      const now = Date.now();
      await dbUpdate("appointments", id, {
        timerStart: now, timerEnd: null, workedMs: null, total: null, status: "In Progress",
        arrivalISO: new Date(now).toISOString()
      });
      toast("Visit started — timer running");
      renderAppointmentDetail(id);
    };

    function startTimerTick(id){
      stopTimerTick();
      timerInterval = setInterval(() => {
        const a = getOne("appointments", id);
        if (!a || !a.timerStart || a.timerEnd){ stopTimerTick(); return; }
        const elapsed = Date.now() - a.timerStart;
        const disp = document.getElementById("timerDisplay");
        if (!disp){ stopTimerTick(); return; }
        disp.textContent = fmtDuration(elapsed);
        const b = billing(elapsed);
        const set = (id2,val) => { const el = document.getElementById(id2); if (el) el.textContent = val; };
        set("curCharge", money(b.total));
        set("curBlocks", b.blocks);
        set("nextCharge", money(b.total + b.perBlock));
        // time until the next billing block starts
        const msIntoBlock = elapsed % (b.blockLen*60000);
        const msLeft = (b.blockLen*60000) - msIntoBlock;
        set("nextIn", fmtDuration(msLeft).slice(3)); // MM:SS
      }, 1000);
    }
    window.stopTimerTick = function(){ if (timerInterval){ clearInterval(timerInterval); timerInterval = null; } };

    window.endVisit = async function(id){
      const a = getOne("appointments", id); if (!a || !a.timerStart) return;
      stopTimerTick();
      const end = Date.now();
      const workedMs = end - a.timerStart;
      const b = billing(workedMs);
      const receiptNo = nextReceiptNo();
      const departureISO = new Date(end).toISOString();

      // 1) Persist timer close-out on the appointment
      await dbUpdate("appointments", id, {
        timerEnd: end, workedMs, total: b.total, status: "Completed", departureISO
      });

      // 2) Create the service record (customer history)
      const serviceData = {
        customerId: a.customerId, customerName: a.customerName,
        dateISO: departureISO,
        serviceType: a.lastServiceType || "General Tech Support",
        description: a.notes || "",
        deviceInfo: (getOne("customers", a.customerId)||{}).devices || "",
        arrivalISO: a.arrivalISO, departureISO,
        workedMs, roundedMinutes: b.roundedMinutes, blocks: b.blocks,
        perBlock: b.perBlock, amount: b.total, // initially just base amount
        paymentMethod: "Cash", receiptNo, notes: a.notes || ""
      };
      const serviceId = await dbAdd("services", serviceData);

      toast("Visit ended — service saved");
      stopTimerTick(); closeModal();
      // 3) Show visit summary + let user finalise service type / payment / receipt
      showVisitSummary(serviceId, b, a);
    };

    window.currentExtraFees = [];

      const desc = document.getElementById('ef_desc').value.trim();

    };

      const fee = window.currentExtraFees[idx];
      document.getElementById('ef_desc').value = fee.desc;
      document.getElementById('ef_amount').value = fee.amount;

    window.renderExtraFeesUI = function() {
      const container = document.getElementById("extraFeesContainer");
      if (!container) return;
      
      let feesTotal = 0;
      let html = `<div class="card" style="background:var(--surface-2); border:1px solid var(--border); padding:14px; margin-top:14px;">
                    <h4 style="margin:0 0 10px 0;">Extra Fees</h4>`;

                  <span>${esc(fee.desc)}</span>

              </div>`;
          });
          html += `<div style="text-align:right; margin-bottom:12px; font-size:13px;" class="muted">Extra Fees Total: <span style="font-weight:700; color:var(--text)">${money(feesTotal)}</span></div>`;
      } else {
          html += `<div class="muted" style="margin-bottom:12px; font-size:13px;">No extra fees added.</div>`;
      }
      
      html += `
          <div class="form-row" style="gap:8px">
              <div class="field" style="margin-bottom:0"><input id="ef_desc" placeholder="Description (e.g. Travel, Setup)"></div>

    window.saveManualService = async function(){

      const minutes = Number(document.getElementById("ms_minutes").value||0);
      if (minutes < 1){ toast("Enter minutes worked","error"); return; }
      
      const b = billing(minutes*60000);
      const extraTotal = window.currentExtraFees.reduce((sum, f) => sum + Number(f.amount), 0);
      const finalAmount = b.total + extraTotal;
      const now = new Date();
      
      await dbAdd("services", {

        serviceType: document.getElementById("ms_type").value,
        description: document.getElementById("ms_desc").value.trim(),

        arrivalISO: now.toISOString(), departureISO: new Date(now.getTime()+minutes*60000).toISOString(),

        perBlock: b.perBlock, amount: finalAmount, extraFees: window.currentExtraFees,
        paymentMethod: document.getElementById("ms_pay").value, receiptNo: nextReceiptNo(),

        perBlock: s.perBlock, amount: s.amount, extraFees: s.extraFees || [], paymentMethod: s.paymentMethod

    window.exportData = function(){
      const data = { customers: cache.customers, appointments: cache.appointments, services: cache.services, receipts: cache.receipts, settings };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = "mmcrm-backup-" + new Date().toISOString().slice(0,10) + ".json";
      a.click(); URL.revokeObjectURL(url);
    };

    window.importData = function(){
      const file = document.getElementById("importFile").files[0];
      if (!file) { toast("Select a file first", "error"); return; }
      const reader = new FileReader();
      reader.onload = async e => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.customers) data.customers.forEach(async c => await setDoc(doc(fdb, "customers", c.id), c));
          if (!fdb) {
             if (data.customers) localStorage.setItem(LS_KEY("customers"), JSON.stringify(data.customers));
             if (data.appointments) localStorage.setItem(LS_KEY("appointments"), JSON.stringify(data.appointments));
             if (data.services) localStorage.setItem(LS_KEY("services"), JSON.stringify(data.services));
             if (data.receipts) localStorage.setItem(LS_KEY("receipts"), JSON.stringify(data.receipts));
             if (data.settings) localStorage.setItem(LS_KEY("settings"), JSON.stringify(data.settings));
             location.reload();
          }
        } catch(err) {
          toast("Invalid backup file", "error");
        }
      };
      reader.readAsText(file);
    };

      if(!q) { res.style.display = "none"; return; }
      let html = "";
      const cust = getAll("customers").filter(c => (c.name||"").toLowerCase().includes(q) || (c.phone||"").includes(q));
      cust.slice(0,3).forEach(c => html += `<div class="sr-item" onclick="viewCustomer('${c.id}');document.getElementById('globalSearch').value='';this.parentElement.style.display='none'">Customer: <b>${esc(c.name)}</b> <small>${esc(c.phone||"")}</small></div>`);
      
      const rcpt = getAll("receipts").filter(r => (r.receiptNo||"").toLowerCase().includes(q));
      rcpt.slice(0,3).forEach(r => html += `<div class="sr-item" onclick="viewReceipt('${r.id}');document.getElementById('globalSearch').value='';this.parentElement.style.display='none'">Receipt: <b>${esc(r.receiptNo)}</b> <small>${esc(r.customerName)}</small></div>`);
      
      if(html){ res.innerHTML = html; res.style.display = "block"; } else { res.style.display = "none"; }
    };
    document.addEventListener("click", e => { if(!e.target.closest(".search-wrap")) document.getElementById("searchResults").style.display="none"; });

    /* ---------- AUTH / INIT ---------- */
    async function boot(){
      applyTheme(localStorage.getItem("mmcrm_theme") || "light");
      await initData();
      
      if (auth) {
         onAuthStateChanged(auth, user => {
            if (user) {
               document.getElementById("loginScreen").style.display = "none";
               renderNav(); navigate("dashboard");
            } else {
               document.getElementById("loginScreen").style.display = "flex";
            }
         });
         document.getElementById("loginBtn").onclick = () => {
            const e = document.getElementById("loginEmail").value;
            const p = document.getElementById("loginPassword").value;
            signInWithEmailAndPassword(auth, e, p).catch(err => toast(err.message, "error"));
         };
      } else {
         document.getElementById("loginScreen").style.display = "none";
         renderNav(); navigate("dashboard");
      }
    }
    boot();
  </script>
</body>
</html>
